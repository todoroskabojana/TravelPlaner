
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Plan Your Trip - Travel Planner</title>

    <!-- Bootstrap 4 -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css">

    <!-- Nas CSS -->
    <link rel="stylesheet" href="proekt.css">
</head>

<body>

    
    <nav class="navbar navbar-expand-lg navbar-dark ">
        <div class="container">

            <a class="navbar-brand" href="proekt.html">
                Travel Planner
            </a>

            <button class="navbar-toggler" type="button"
                    data-toggle="collapse" data-target="#meni">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="meni">
                <ul class="navbar-nav ml-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="proekt.html">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="destination.html">
                            Destinations
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="blog.html">Blog</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="survey.html">Survey</a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>

    <!-- Planiranje na patuvanje -->
    <main class="container mt-5">

        <h1 class="text-center mb-4">Plan Your Trip</h1>

        <p class="text-center">
            Choose your destination and start planning your adventure!
        </p>

        <div class="row">
            <div class="col-md-8 mx-auto">

                <div class="card p-4">

                    <!-- destinacija -->
                    <div class="form-group">

                        <label for="grad">Choose Destination:</label>

                        <select id="grad" class="form-control">
                            <option value="">Select destination</option>
                            <option value="Paris">Paris, France</option>
                            <option value="Rome">Rome, Italy</option>
                            <option value="Santorini">Santorini, Greece</option>
                            <option value="Barcelona">Barcelona, Spain</option>
                            <option value="London">London, United Kingdom</option>
                        </select>

                    </div>

                    <!--kategorija-->
                    <div class="form-group">

                        <label for="kategorija">Category:</label>

                        <select id="kategorija" class="form-control">
                            <option value="">Select category</option>
                            <option value="City">City</option>
                            <option value="Beach">Beach</option>
                            <option value="Nature">Nature</option>
                            <option value="Adventure">Adventure</option>
                        </select>

                    </div>

                    <!-- budzet -->
                    <div class="form-group">

                        <label for="budzet">Your Budget (€):</label>

                        <input type="number"
                               id="budzet"
                               class="form-control"
                               placeholder="Enter your budget">

                    </div>

                   
                    <button type="button"
                            class="btn btn-primary"
                            onclick="exploreDestination()">
                        Explore Destination
                    </button>

                    <p id="poraka" class="mt-3"></p>

                </div>
            </div>
        </div>

    </main>

    
    <footer class=" text-white text-center p-3">

     <img src="images/footer.jpg"
         alt="Explore the World"
         class="footer-slika">

     <p>Discover new places and create unforgettable memories.</p>
     <p>2026 Travel Planner</p>

    </footer>

   
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.slim.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/js/bootstrap.bundle.min.js"></script>

    
    <script src="proekt.js"></script>

</body>
</html>
